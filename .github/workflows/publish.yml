name: Publish to PyPI

on:
  release:
    types: [published]
  # Manual runs build and validate distributions without publishing them.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pypi-${{ github.event.release.tag_name || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and validate distributions
    runs-on: ubuntu-latest
    steps:
      - name: Check out release source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Check release tag against package version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import tomllib

          project = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))["project"]
          tag = os.environ.get("RELEASE_TAG", "")
          expected = f"v{project['version']}"
          if tag and tag != expected:
              raise SystemExit(f"Release tag {tag!r} must match {expected!r}")
          print(f"Building {project['name']} {project['version']}")
          PY

      - name: Install build tools
        run: python -m pip install --upgrade build twine

      # python -m build builds the wheel from the source distribution.
      - name: Build source distribution and wheel
        run: python -m build

      - name: Check distribution metadata and README
        run: python -m twine check --strict dist/*

      - name: Install wheel and test the installed package
        env:
          MPLBACKEND: Agg
        run: |
          python -m pip install dist/*.whl
          cd "$RUNNER_TEMP"
          python -m unittest discover -s "$GITHUB_WORKSPACE/tests" -v

      - name: Upload distributions
        uses: actions/upload-artifact@v7
        with:
          name: python-distributions
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish distributions to PyPI
    needs: build
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/tovis/
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v8
        with:
          name: python-distributions
          path: dist/

      # Configure PyPI Trusted Publishing for groupmm/tovis, workflow
      # publish.yml, environment pypi. No PyPI API token is required.
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
